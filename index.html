<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockPro — Supabase</title>

<style>
:root{--nav:#123247;--green:#087f68;--blue:#2c6397;--background:#f1f5f9;--border:#cddae5;--text:#20394c}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:14px system-ui,Arial,sans-serif}
button,input,select{font:inherit}button{padding:10px 13px;border:1px solid var(--border);border-radius:6px;background:white;color:var(--text);cursor:pointer}
button:disabled{opacity:.5;cursor:default}input,select{width:100%;padding:10px;border:1px solid #b9cbd8;border-radius:5px;background:white}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.primary{background:var(--green);color:white;border-color:var(--green)}.danger{color:#af2539}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}aside{background:var(--nav);color:white;padding:22px 12px}
aside h2{padding-left:10px}aside button{display:block;width:100%;text-align:left;color:#d6e7f1;background:transparent;border:0;margin:4px 0}
aside button.active{background:#29566f}main{padding:22px;min-width:0}header,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
header{justify-content:space-between;margin-bottom:18px}h1{font-size:25px;margin:0 0 6px}h2{font-size:19px}p{line-height:1.6}
.muted{color:#64798a;font-size:13px}.notice{background:#fff4d9;border:1px solid #ead6a0;padding:12px;border-radius:7px;line-height:1.6;margin:16px 0}
.vertical{display:flex;flex-direction:column;gap:15px}.card{background:white;border:1px solid #d8e3ec;padding:20px;border-radius:9px;min-width:0}
.metric{border-left:5px solid var(--green)}.metric strong{display:block;color:var(--green);font-size:29px;margin-top:10px}
.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th,td{padding:11px;border:1px solid var(--border);text-align:left}
th{background:var(--blue);color:white}tr:nth-child(even){background:#edf3f9}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.toolbar>*{flex:1;min-width:140px}.auth{max-width:530px;margin:5vh auto;padding:28px;background:white;border-radius:12px}
.auth input{margin:5px 0 16px}dialog{width:min(850px,96vw);max-height:90vh;overflow:auto;padding:24px;border:0;border-radius:12px}
dialog::backdrop{background:#102c4099}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.error{color:#af2037}.success{color:var(--green)}
.cancelled{color:#af2539;font-weight:700}.active{color:var(--green);font-weight:700}.inactive{color:#af2539;font-weight:700}
#status{padding:0 22px 12px;white-space:pre-wrap;overflow-wrap:anywhere}#print{display:none}
@media(max-width:760px){.shell{display:block}aside{padding:12px}aside h2{display:none}main{padding:14px}}
@media print{body>*{display:none!important}#print{display:block!important;background:white;color:black}#print .scroll{overflow:visible!important}
#print table{width:100%;table-layout:fixed;white-space:normal;font-size:8px}#print td,#print th{padding:5px 3px;white-space:normal;overflow-wrap:anywhere;vertical-align:top}
#print th{color:black;background:#eee}#print thead{display:table-header-group}#print tr{break-inside:avoid;page-break-inside:avoid}
#print .vertical{display:block}#print .card{border:0;border-radius:0;padding:6px;margin:8px 0}#print .metric strong{font-size:18px}
#print h1{font-size:20px}#print h2{font-size:16px}@page{size:A4 landscape;margin:8mm}}
</style>
</head>

<body>
<div id="app"></div>
<p id="status" role="status"></p>
<dialog id="modal"></dialog>
<div id="print"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

const SUPABASE_URL="https://qcrcuncmgfxojdhcdtno.supabase.co";
const SUPABASE_PUBLIC_KEY="sb_publishable_5Gugsp17R5waoCb_osr1Kg_v8daehTW";

const $=id=>document.getElementById(id);
const escapeHTML=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const number=value=>Number(value).toLocaleString("fr-FR",{maximumFractionDigits:3});
const today=()=>{const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")};

let client=null,user=null,profile=null,page="dashboard",db={},loadedAt=null,sessionEpoch=0,refreshBusy=false,realtimeChannel=null,refreshTimer=null,realtimeTimer=null;
let filters={q:"",depot:"",from:"",to:""};

const admin=()=>profile?.role==="admin";
const movementTypes=["entries","outputs","transfers","adjustments"];
const referenceTypes=["products","depots","clients","suppliers"];
const active=row=>row?.status!=="cancelled";

const titles={dashboard:"Tableau de bord",entries:"Entrées",outputs:"Sorties et livraisons",transfers:"Transferts",inventory:"Inventaire",products:"Produits",depots:"Dépôts",clients:"Clients",suppliers:"Fournisseurs",accounts:"Comptes",audit:"Historique",settings:"Paramètres"};

const schemas={
products:[["name","Produit","text",1],["sku","Référence / SKU","text",1],["unit","Unité : sac, carton, pièce…","text",1],["min","Seuil de stock bas","number",1]],
depots:[["name","Nom du dépôt","text",1],["address","Adresse"],["manager","Responsable"],["phone","Téléphone","tel"]],
clients:[["name","Client","text",1],["phone","Téléphone","tel"],["address","Adresse"]],
suppliers:[["name","Fournisseur","text",1],["phone","Téléphone","tel"],["address","Adresse"]],
entries:[["date","Date","date",1],["ref","N° bon ou facture","text",1],["product_id","Produit","products",1],["packing","Packing-list"],["qty","Quantité reçue","number",1],["supplier_id","Fournisseur","suppliers",1],["depot_id","Dépôt","depots",1],["lot","Lot"],["expiry","Date d’expiration","date"],["driver","Chauffeur ou trucking"],["note","Remarque"]],
outputs:[["date","Date de livraison","date",1],["invoice","Facture","text",1],["invoice_qty","Qté sur la facture","number",1],["product_id","Produit","products",1],["client_id","Client","clients",1],["qty","Avance : quantité livrée cette fois","number",1],["driver","Chauffeur"],["plate","Plaque"],["ref","N° bon de livraison","text",1],["depot_id","Dépôt","depots",1],["phone","Téléphone du chauffeur","tel"],["note","Remarque"]],
transfers:[["date","Date","date",1],["ref","N° transfert","text",1],["product_id","Produit","products",1],["source_id","Dépôt source","depots",1],["dest_id","Dépôt destination","depots",1],["qty","Quantité","number",1],["driver","Chauffeur ou trucking"],["plate","Plaque"],["note","Remarque"]],
adjustments:[["date","Date","date",1],["product_id","Produit","products",1],["depot_id","Dépôt","depots",1],["counted_qty","Quantité physiquement comptée","number",1],["note","Motif obligatoire","text",1]]
};

function showStatus(message,error=false){$("status").textContent=message;$("status").className=error?"error":"success"}

function showLogin(){page="dashboard";$("app").innerHTML=`<section class="auth"><h1>StockPro</h1><p>Connexion Supabase · Données partagées</p><div class="notice">Utilisez l’adresse e-mail et le mot de passe créés dans Supabase Auth. Les anciennes données locales ne sont pas encore importées.</div><form id="loginForm"><label>Adresse e-mail</label><input name="email" type="email" autocomplete="username" required><label>Mot de passe</label><input name="password" type="password" autocomplete="current-password" required><button class="primary">Se connecter</button><p id="loginError" class="error"></p></form></section>`;
$("loginForm").onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector("button");button.disabled=true;$("loginError").textContent="";try{const v=Object.fromEntries(new FormData(e.target));const{error}=await client.auth.signInWithPassword({email:v.email.trim(),password:v.password});if(error)throw error;await openSession()}catch(x){$("loginError").textContent=x.message}finally{button.disabled=false}}}

async function readAll(table){const rows=[];for(let start=0;;start+=500){const{data,error}=await client.from(table).select("*").order("id").range(start,start+499);if(error)throw Error(table+" : "+error.message);rows.push(...data);if(data.length<500)break}return rows}

async function fetchData(){const result={};const tables=[...referenceTypes,"entries","invoice_lines","outputs","transfers","adjustments"];if(admin()){tables.push("audit_log");tables.push("profiles")}
for(const table of tables)result[table]=await readAll(table);result.audit_log=result.audit_log||[];result.profiles=result.profiles||[];return result}

async function openSession(){const epoch=++sessionEpoch;const{data:{session},error}=await client.auth.getSession();if(error)throw error;if(!session){user=null;profile=null;db={};stopRealtime();showLogin();return}
const{data:account,error:profileError}=await client.from("profiles").select("id,name,role").eq("id",session.user.id).maybeSingle();if(profileError)throw profileError;if(!account)throw Error("Compte connecté sans profil autorisé. Vérifiez son UUID dans la table profiles.");if(epoch!==sessionEpoch)return;
user=session.user;profile=account;const next=await fetchData();if(epoch!==sessionEpoch)return;db=next;loadedAt=new Date();render();startRealtime();startAutoRefresh();showStatus("Connexion réussie. Actualisation automatique activée.")}

async function refresh(silent=false){if(refreshBusy||!profile)return;refreshBusy=true;if(!silent)showStatus("Actualisation…");const epoch=sessionEpoch;try{const next=await fetchData();if(epoch!==sessionEpoch)return;db=next;loadedAt=new Date();render();if(!silent)showStatus("Données actualisées.")}catch(x){showStatus("Actualisation impossible : "+x.message,true)}finally{refreshBusy=false}}

function startAutoRefresh(){clearInterval(refreshTimer);refreshTimer=setInterval(()=>refresh(true),30000)}

function startRealtime(){stopRealtime();if(!client||!profile)return;
realtimeChannel=client.channel("stockpro-realtime");
["products","depots","clients","suppliers","entries","invoice_lines","outputs","transfers","adjustments","profiles","audit_log"].forEach(table=>{
realtimeChannel.on("postgres_changes",{event:"*",schema:"public",table},()=>scheduleRealtimeRefresh())});
realtimeChannel.subscribe(status=>{if(status==="SUBSCRIBED")showStatus("Actualisation en temps réel connectée.")})}

function stopRealtime(){clearInterval(realtimeTimer);if(realtimeChannel){client?.removeChannel(realtimeChannel);realtimeChannel=null}}

function scheduleRealtimeRefresh(){clearTimeout(realtimeTimer);realtimeTimer=setTimeout(()=>refresh(true),1500)}

async function logout(){try{const{error}=await client.auth.signOut();if(error)throw error;sessionEpoch++;user=null;profile=null;db={};stopRealtime();clearInterval(refreshTimer);$("modal").close();showLogin();showStatus("Déconnecté.")}catch(x){showStatus(x.message,true)}}

function itemName(type,id){return db[type]?.find(x=>x.id===id)?.name||"—"}
function enrichedOutputs(){return db.outputs.filter(active).map(o=>{const line=db.invoice_lines.find(i=>i.id===o.invoice_line_id);return{...o,invoice:line?.invoice||"—",invoice_qty:Number(line?.invoice_qty||0),product_id:line?.product_id,client_id:line?.client_id}})}
function delivered(lineId){return db.outputs.filter(o=>active(o)&&o.invoice_line_id===lineId).reduce((s,o)=>s+Number(o.qty),0)}

function stock(productId,depotId){const sum=(table,condition,field="qty")=>db[table].filter(active).filter(condition).reduce((s,r)=>s+Number(r[field]),0);
const outputs=enrichedOutputs().filter(r=>r.product_id===productId&&r.depot_id===depotId).reduce((s,r)=>s+Number(r.qty),0);
return sum("entries",r=>r.product_id===productId&&r.depot_id===depotId)-outputs+sum("transfers",r=>r.product_id===productId&&r.dest_id===depotId)-sum("transfers",r=>r.product_id===productId&&r.source_id===depotId)+sum("adjustments",r=>r.product_id===productId&&r.depot_id===depotId,"delta")}

function units(rows){const totals={};rows.forEach(r=>{const unit=db.products.find(p=>p.id===r.product_id)?.unit||"?";totals[unit]=(totals[unit]||0)+Number(r.qty)});return Object.entries(totals).map(([u,q])=>number(q)+" "+escapeHTML(u)).join("<br>")||"0"}
function inventoryRows(){return db.products.flatMap(p=>db.depots.map(d=>({product_id:p.id,depot_id:d.id,qty:stock(p.id,d.id),unit:p.unit,min:Number(p.min)}))).filter(matches)}

function table(headers,rows){return`<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${escapeHTML(h)}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${headers.length}">Aucune donnée.</td></tr>`}</tbody></table></div>`}
function panel(title,content){return`<section class="card"><h2>${title}</h2>${content}</section>`}

function matches(row){const text=[JSON.stringify(row),itemName("products",row.product_id),itemName("clients",row.client_id),itemName("suppliers",row.supplier_id),itemName("depots",row.depot_id)].join(" ").toLowerCase();
return(!filters.q||text.includes(filters.q.toLowerCase()))&&(!filters.depot||[row.depot_id,row.source_id,row.dest_id].includes(filters.depot))&&(!row.date||!filters.from||row.date>=filters.from)&&(!row.date||!filters.to||row.date<=filters.to)}

function filterBar(){return`<div class="toolbar"><input aria-label="Recherche" placeholder="Rechercher…" value="${escapeHTML(filters.q)}" onchange="setFilter('q',this.value)"><select aria-label="Dépôt" onchange="setFilter('depot',this.value)"><option value="">Tous les dépôts</option>${db.depots.map(d=>`<option value="${d.id}" ${d.id===filters.depot?"selected":""}>${escapeHTML(d.name)}</option>`).join("")}</select><input type="date" aria-label="Du" title="Du" value="${escapeHTML(filters.from)}" onchange="setFilter('from',this.value)"><input type="date" aria-label="Au" title="Au" value="${escapeHTML(filters.to)}" onchange="setFilter('to',this.value)"><button onclick="resetFilters()">Effacer les filtres</button></div>`}
function setFilter(k,v){filters[k]=v;render()}
function resetFilters(){filters={q:"",depot:"",from:"",to:""};render()}
function go(destination){page=destination;resetFilters();render()}

function render(){if(!profile)return showLogin();if(["audit","settings","accounts"].includes(page)&&!admin())page="dashboard";
$("app").innerHTML=`<div class="shell"><aside><h2>StockPro</h2><nav>${Object.entries(titles).filter(([k])=>admin()||!["accounts","audit","settings"].includes(k)).map(([k,v])=>`<button class="${k===page?"active":""}" onclick="go('${k}')">${v}</button>`).join("")}</nav></aside><main><header><div><h1>${titles[page]}</h1><span class="muted">${escapeHTML(profile.name)} · ${admin()?"Administrateur":"Utilisateur"} · Supabase<br>Dernier chargement : ${escapeHTML(loadedAt?.toLocaleString("fr-FR")||"—")}</span></div><div class="actions"><button onclick="refresh()">Actualiser</button>${page!=="settings"&&page!=="accounts"?`<button class="primary" onclick="printPage()">Exporter le tableau en PDF</button>`:""}<button onclick="logout()">Déconnexion</button></div></header><div class="notice">Actualisation automatique toutes les 30 secondes. Les changements effectués sur un autre appareil apparaissent aussi automatiquement. Les administrateurs peuvent gérer les comptes, modifier et annuler les mouvements.</div><div id="content"></div></main></div>`;
if(page==="dashboard")showDashboard();else if(page==="inventory")showInventory();else if(page==="accounts")showAccounts();else if(page==="audit")showAudit();else if(page==="settings")showSettings();else showList()}

function showDashboard(){const inventory=inventoryRows(),entries=db.entries.filter(active).filter(matches),outputs=enrichedOutputs().filter(matches),transfers=db.transfers.filter(active).filter(matches);
const pending=db.invoice_lines.filter(line=>Number(line.invoice_qty)>delivered(line.id));
const limit=new Date();limit.setDate(limit.getDate()+30);const expirations=db.entries.filter(active).filter(r=>r.expiry&&r.expiry<=limit.toISOString().slice(0,10)&&matches(r));
const indicators=[["Total entrées",units(entries)],["Total sorties — avances livrées",units(outputs)],["Total produits",db.products.length],["Stock disponible",units(inventory)],["Dépôts",db.depots.length],["Transferts",transfers.length]];
$("content").innerHTML=filterBar()+`<p class="muted">Les dates filtrent les mouvements, pas les stocks actuels. Les unités différentes sont séparées. Les mouvements annulés sont exclus des totaux et du stock.</p><div class="vertical">${indicators.map(([t,v])=>`<section class="card metric">${t}<strong>${v}</strong></section>`).join("")}
${panel("Stock par produit et dépôt",table(["Produit","Dépôt","Disponible","Unité"],inventory.map(r=>[escapeHTML(itemName("products",r.product_id)),escapeHTML(itemName("depots",r.depot_id)),number(r.qty),escapeHTML(r.unit)])))}
${panel("Dépôts",table(["Dépôt","Responsable","Téléphone"],db.depots.filter(d=>!filters.depot||d.id===filters.depot).map(d=>[escapeHTML(d.name),escapeHTML(d.manager),escapeHTML(d.phone)])))}
${panel("Transferts — tous les résultats filtrés",table(["Date","Produit","Source","Destination","Quantité","État"],transfers.map(r=>[escapeHTML(r.date),escapeHTML(itemName("products",r.product_id)),escapeHTML(itemName("depots",r.source_id)),escapeHTML(itemName("depots",r.dest_id)),number(r.qty),r.status==="cancelled"?'<span class="cancelled">Annulé</span>':"Actif"])))}
${panel("Alertes d’inventaire",table(["Produit","Dépôt","Stock","Seuil"],inventory.filter(r=>r.qty<=r.min).map(r=>[escapeHTML(itemName("products",r.product_id)),escapeHTML(itemName("depots",r.depot_id)),number(r.qty),number(r.min)])))}
${panel("Balances à livrer — toutes dates et tous dépôts",table(["Facture","Client","Produit","Facturé","Livré","Balance"],pending.map(l=>[escapeHTML(l.invoice),escapeHTML(itemName("clients",l.client_id)),escapeHTML(itemName("products",l.product_id)),number(l.invoice_qty),number(delivered(l.id)),number(Number(l.invoice_qty)-delivered(l.id))])))}
${panel("Expirations à surveiller",table(["Produit","Lot","Dépôt","Expiration"],expirations.map(r=>[escapeHTML(itemName("products",r.product_id)),escapeHTML(r.lot),escapeHTML(itemName("depots",r.depot_id)),escapeHTML(r.expiry)]))+`<p class="muted">Réceptions expirées ou expirant dans les 30 jours. Pas de décompte du solde par lot : un lot affiché peut déjà avoir été livré.</p>`)}</div>`}

function fieldValue(type,key,row){const def=schemas[type].find(f=>f[0]===key);if(referenceTypes.includes(def?.[2]))return itemName(def[2],row[key]);return row[key]??""}

function showList(){const type=page;const rows=(type==="outputs"?enrichedOutputs():db[type]).filter(matches);const defs=schemas[type];const isRef=referenceTypes.includes(type);const canAdd=isRef?admin():true;const canManage=admin();
$("content").innerHTML=`${canAdd?`<button class="primary" onclick="editRecord('${type}')">+ Ajouter</button>`:""}${type==="outputs"?`<p class="notice">Avance = quantité livrée cette fois. Pour livrer le reliquat, réutilisez les mêmes facture, client, produit et quantité facturée. La balance est actuelle et peut se répéter : ne l’additionnez pas. Les sorties annulées sont exclues du stock et des balances.</p>`:""}${filterBar()}<p class="muted">${rows.length} ligne(s). Le PDF contient tout le tableau affiché.</p>${table([...defs.map(f=>f[1]),...(type==="outputs"?["Livré cumulé","Balance actuelle"]:[]),"État",...(canManage?["Actions"]:[])],rows.map(r=>[...defs.map(f=>escapeHTML(fieldValue(type,f[0],r))),...(type==="outputs"?[number(delivered(r.invoice_line_id)),number(r.invoice_qty-delivered(r.invoice_line_id))]:[]),r.status==="cancelled"?'<span class="cancelled">Annulé</span>':"Actif",...(canManage?[r.status==="cancelled"?`<span class="cancelled">Annulé</span>`:`<div class="actions"><button onclick="editRecord('${type}','${r.id}')">Modifier</button><button class="danger" onclick="cancelMovement('${type}','${r.id}')">Annuler</button></div>`]:[])]))}`}

function showInventory(){$("content").innerHTML=`${admin()?`<button class="primary" onclick="editRecord('adjustments')">Comptage / ajustement</button>`:""}<p class="muted">Le stock est dérivé des mouvements actifs. Les comptages annulés sont exclus du calcul.</p>${filterBar()}${table(["Produit","Dépôt","Stock","Unité","Seuil","État"],inventoryRows().map(r=>[escapeHTML(itemName("products",r.product_id)),escapeHTML(itemName("depots",r.depot_id)),number(r.qty),escapeHTML(r.unit),number(r.min),r.qty<=0?"Rupture":r.qty<=r.min?"Stock bas":"Disponible"]))}<h2>Historique des comptages</h2>${table(["Date","Produit","Dépôt","Compté","Écart","Motif","État","Actions"],db.adjustments.filter(matches).map(r=>[escapeHTML(r.date),escapeHTML(itemName("products",r.product_id)),escapeHTML(itemName("depots",r.depot_id)),number(r.counted_qty),number(r.delta),escapeHTML(r.note),r.status==="cancelled"?'<span class="cancelled">Annulé</span>':"Actif",admin()&&active(r)?`<div class="actions"><button onclick="editRecord('adjustments','${r.id}')">Modifier</button><button class="danger" onclick="cancelMovement('adjustments','${r.id}')">Annuler</button></div>`:""]))}`}

function selectOptions(type,selected){return'<option value="">Choisir…</option>'+db[type].map(item=>`<option value="${item.id}" ${item.id===selected?"selected":""}>${escapeHTML(item.name)}</option>`).join("")}

function editRecord(type,id){
if(id&&!admin())return;
if((referenceTypes.includes(type)||type==="adjustments")&&!admin())return;
const row=db[type]?.find(item=>item.id===id)||{};
if(id&&movementTypes.includes(type)&&!active(row)){showStatus("Ce mouvement est annulé et ne peut plus être modifié.",true);return}
const isMovement=movementTypes.includes(type);
let requestId=crypto.randomUUID(),lastPayload=null,saving=false;

$("modal").innerHTML=`<h2>${id?(isMovement?"Modifier le mouvement":"Modifier"):"Ajouter"} — ${titles[type]||"Comptage"}</h2>${isMovement?`<p class="muted">La modification est enregistrée dans Supabase et conservée dans l’historique.</p>`:""}<form id="recordForm"><div class="fields">${schemas[type].map(([key,label,fieldType="text",required])=>{const value=row[key]??(key==="date"?today():key==="min"?0:"");return`<div><label for="field_${key}">${escapeHTML(label)}${required?" *":""}</label>${referenceTypes.includes(fieldType)?`<select id="field_${key}" name="${key}" ${required?"required":""}>${selectOptions(fieldType,value)}</select>`:`<input id="field_${key}" name="${key}" type="${fieldType}" value="${escapeHTML(value)}" ${fieldType==="number"?'min="0" step="0.001"':""} ${required?"required":""}>`}</div>`}).join("")}</div><p id="formError" class="error"></p><div class="footer"><button id="cancelButton" type="button">Annuler</button><button id="saveButton" class="primary" type="submit">${id?"Enregistrer la modification":"Enregistrer"}</button></div></form>`;

$("modal").showModal();
$("cancelButton").onclick=()=>{if(!saving)$("modal").close()};
$("modal").oncancel=e=>{if(saving)e.preventDefault()};

$("recordForm").onsubmit=async e=>{e.preventDefault();if(saving)return;
const payload=Object.fromEntries(new FormData(e.target));
for(const[key,,fieldType,required]of schemas[type]){if(typeof payload[key]==="string")payload[key]=payload[key].trim();if(required&&!String(payload[key]??"").trim()){$("formError").textContent="Remplissez les champs obligatoires.";return}if(fieldType==="number"){payload[key]=Number(payload[key]);if(!Number.isFinite(payload[key])||payload[key]<0){$("formError").textContent="Quantité invalide.";return}}}
if(["entries","outputs","transfers"].includes(type)&&payload.qty<=0){$("formError").textContent="La quantité doit être supérieure à zéro.";return}
const serialized=JSON.stringify(payload);if(lastPayload!==null&&lastPayload!==serialized)requestId=crypto.randomUUID();lastPayload=serialized;
saving=true;$("saveButton").disabled=true;$("cancelButton").disabled=true;$("formError").textContent="";let committed=false;
try{
if(referenceTypes.includes(type)){const response=id?await client.from(type).update(payload).eq("id",id).select("id").single():await client.from(type).insert({id:requestId,...payload}).select("id").single();if(response.error)throw response.error}
else if(id){const{error}=await client.rpc("stockpro_update_movement",{p_kind:type,p_id:id,p_data:payload,p_request_id:requestId});if(error)throw error}
else{const{error}=await client.rpc("stockpro_add_movement",{p_kind:type,p_data:payload,p_request_id:requestId});if(error)throw error}
committed=true;$("modal").close();showStatus("Enregistrement confirmé dans Supabase. Actualisation…");
const epoch=sessionEpoch;const next=await fetchData();if(epoch!==sessionEpoch)return;db=next;loadedAt=new Date();render();showStatus(id?"Modification enregistrée et données actualisées.":"Enregistrement effectué et données actualisées.")
}catch(x){
if(committed)showStatus("Enregistrement confirmé, mais affichage non actualisé : "+x.message+". Ne recréez pas ce mouvement ; cliquez sur Actualiser.",true);
else if($("formError"))$("formError").textContent=x.message+" En cas de coupure réseau, réessayez sans fermer le formulaire ni modifier les valeurs.";
else showStatus(x.message,true)
}finally{saving=false;if($("saveButton"))$("saveButton").disabled=false;if($("cancelButton"))$("cancelButton").disabled=false}}}

async function cancelMovement(type,id){
if(!admin()||!movementTypes.includes(type))return;
if(!confirm("Annuler ce mouvement ? Il sera exclu du stock, mais restera visible dans l’historique."))return;
try{const{error}=await client.rpc("stockpro_cancel_movement",{p_kind:type,p_id:id,p_request_id:crypto.randomUUID()});if(error)throw error;
showStatus("Annulation confirmée dans Supabase. Actualisation…");const epoch=sessionEpoch;const next=await fetchData();if(epoch!==sessionEpoch)return;db=next;loadedAt=new Date();render();showStatus("Mouvement annulé et données actualisées.")}
catch(x){showStatus("Annulation impossible : "+x.message,true)}}

async function deleteReference(type,id){if(!admin()||!referenceTypes.includes(type))return;if(!confirm("Supprimer cet élément ? La base bloquera la suppression s’il est utilisé par un mouvement."))return;
try{const{data,error}=await client.from(type).delete().eq("id",id).select("id");if(error)throw error;if(!data.length)throw Error("Élément absent ou accès refusé.");showStatus("Suppression confirmée.");await refresh()}catch(x){showStatus("Suppression refusée : "+x.message,true)}}

function showAccounts(){if(!admin())return;
$("content").innerHTML=`<button class="primary" onclick="createAccount()">+ Créer un compte</button><p class="muted">Les comptes sont gérés dans Supabase. Un administrateur peut créer un compte, changer son rôle et l’activer ou le désactiver.</p>${table(["Nom","E-mail","Rôle","Statut","Actions"],db.profiles.map(p=>[escapeHTML(p.name),escapeHTML(p.email||"—"),p.role==="admin"?"Administrateur":"Utilisateur",p.active?'<span class="active">Actif</span>':'<span class="inactive">Désactivé</span>',p.id===profile.id?'<span class="muted">Votre compte</span>':`<div class="actions"><button onclick="changeRole('${p.id}','${p.role==="admin"?"user":"admin"}')">${p.role==="admin"?"Mettre utilisateur":"Mettre administrateur"}</button><button class="danger" onclick="toggleAccount('${p.id}',${!p.active})">${p.active?"Désactiver":"Activer"}</button></div>`]))}`}

function createAccount(){
if(!admin())return;
$("modal").innerHTML=`<h2>Créer un compte</h2><form id="accountForm"><div class="fields"><div><label for="account_name">Nom complet *</label><input id="account_name" name="name" required></div><div><label for="account_email">Adresse e-mail *</label><input id="account_email" name="email" type="email" required></div><div><label for="account_password">Mot de passe *</label><input id="account_password" name="password" type="password" minlength="8" required></div><div><label for="account_role">Rôle *</label><select id="account_role" name="role" required><option value="user">Utilisateur</option><option value="admin">Administrateur</option></select></div></div><p id="accountError" class="error"></p><div class="footer"><button id="accountCancel" type="button">Annuler</button><button id="accountSave" class="primary" type="submit">Créer le compte</button></div></form>`;
$("modal").showModal();
$("accountCancel").onclick=()=>$("modal").close();
$("accountForm").onsubmit=async e=>{e.preventDefault();const button=$("accountSave");button.disabled=true;$("accountError").textContent="";
const v=Object.fromEntries(new FormData(e.target));
try{const{error}=await client.rpc("stockpro_create_account",{p_email:v.email.trim(),p_password:v.password,p_name:v.name.trim(),p_role:v.role});if(error)throw error;
$("modal").close();showStatus("Compte créé. Actualisation…");await refresh();showStatus("Compte créé avec succès.")}
catch(x){$("accountError").textContent=x.message}
finally{button.disabled=false}}}

async function changeRole(id,role){
if(!admin())return;
if(!confirm(`Changer le rôle de ce compte en ${role==="admin"?"administrateur":"utilisateur"} ?`))return;
try{const{error}=await client.rpc("stockpro_set_role",{p_user_id:id,p_role:role});if(error)throw error;showStatus("Rôle modifié. Actualisation…");await refresh();showStatus("Rôle modifié avec succès.")}
catch(x){showStatus("Modification impossible : "+x.message,true)}}

async function toggleAccount(id,nextActive){
if(!admin())return;
if(!confirm(nextActive?"Activer ce compte ?":"Désactiver ce compte ? Il ne pourra plus se connecter."))return;
try{const{error}=await client.rpc("stockpro_set_active",{p_user_id:id,p_active:nextActive});if(error)throw error;showStatus("Statut modifié. Actualisation…");await refresh();showStatus(nextActive?"Compte activé.":"Compte désactivé.")}
catch(x){showStatus("Modification impossible : "+x.message,true)}}

function showAudit(){$("content").innerHTML=`<p class="muted">Historique serveur des mouvements créés, modifiés et annulés. Les modifications des listes de référence ne sont pas encore journalisées.</p>${table(["Date","Utilisateur (UUID)","Action","Module","Référence","Motif","Détail"],db.audit_log.slice().sort((a,b)=>b.created_at.localeCompare(a.created_at)).map(r=>[escapeHTML(new Date(r.created_at).toLocaleString("fr-FR")),escapeHTML(r.actor_id),escapeHTML(r.action),escapeHTML(r.entity_type),escapeHTML(r.entity_id),escapeHTML(r.reason),`<button onclick="auditDetail('${r.id}')">Voir</button>`]))}`}

function auditDetail(id){const record=db.audit_log.find(r=>r.id===id);$("modal").innerHTML=`<h2>Détail de l’opération</h2><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${escapeHTML(JSON.stringify(record,null,2))}</pre><button id="closeAudit">Fermer</button>`;$("modal").oncancel=null;$("modal").showModal();$("closeAudit").onclick=()=>$("modal").close()}

function printPage(){if(!profile||["settings","accounts"].includes(page))return;const copy=$("content").cloneNode(true);copy.querySelectorAll("button,input,select,.toolbar").forEach(e=>e.remove());
copy.querySelectorAll("table").forEach(item=>{const last=item.querySelector("thead tr")?.lastElementChild;if(["Actions","Détail"].includes(last?.textContent))item.querySelectorAll("tr").forEach(row=>row.lastElementChild?.remove())});
const active=filters.q||filters.depot||filters.from||filters.to;
$("print").innerHTML=`<h1>StockPro</h1><h2>${escapeHTML(titles[page])}</h2><p>Édité par ${escapeHTML(profile.name)} le ${escapeHTML(new Date().toLocaleString("fr-FR"))}.</p><p>Données chargées le ${escapeHTML(loadedAt?.toLocaleString("fr-FR")||"—")}.</p><p>${active?"Tous les résultats correspondant aux filtres actifs.":"Toutes les lignes de la rubrique, sans filtre."}</p>${active?`<p>Recherche : ${escapeHTML(filters.q||"—")} · Dépôt : ${escapeHTML(filters.depot?itemName("depots",filters.depot):"Tous")} · Du : ${escapeHTML(filters.from||"—")} · Au : ${escapeHTML(filters.to||"—")}</p>`:""}${copy.innerHTML}<p style="margin-top:30px">Signature / cachet : __________________________</p>`;window.print()}

function showSettings(){$("content").innerHTML=`<div class="vertical">${panel("Actualisation automatique",`<p>Les données sont actualisées automatiquement toutes les 30 secondes. Les changements effectués sur un autre appareil apparaissent aussi grâce à l’actualisation en temps réel.</p><p>Vous pouvez toujours cliquer sur Actualiser pour forcer une mise à jour.</p>`)}${panel("Comptes et accès",`<p>Les administrateurs peuvent créer des comptes, définir le rôle administrateur ou utilisateur, et activer ou désactiver un compte.</p><p>Un compte désactivé ne peut plus se connecter.</p>`)}${panel("Limites actuelles",`<p>L’import des anciennes données reste à ajouter. Les modifications des listes de référence ne sont pas encore journalisées.</p>`)}</div>`}

(async()=>{try{if(!window.supabase)throw Error("Chargement de la bibliothèque Supabase impossible. Vérifiez votre connexion puis rechargez.");client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY);$("app").innerHTML='<main><h1>StockPro</h1><p>Connexion à Supabase…</p></main>';await openSession()}catch(x){if(client)showLogin();else $("app").innerHTML='<main><h1>StockPro</h1></main>';showStatus(x.message,true)}})();
</script>
