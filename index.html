<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockPro — Supabase</title>

<style>
:root {
  --nav: #123247;
  --green: #087f68;
  --blue: #2c6397;
  --background: #f1f5f9;
  --border: #cddae5;
  --text: #20394c;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font: 14px system-ui, Arial, sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  padding: 10px 13px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: white;
  color: var(--text);
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: default;
}

input,
select {
  width: 100%;
  padding: 10px;
  border: 1px solid #b9cbd8;
  border-radius: 5px;
  background: white;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}

.primary {
  background: var(--green);
  color: white;
  border-color: var(--green);
}

.danger {
  color: #af2539;
}

.shell {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  min-height: 100vh;
}

aside {
  background: var(--nav);
  color: white;
  padding: 22px 12px;
}

aside h2 {
  padding-left: 10px;
}

aside button {
  display: block;
  width: 100%;
  text-align: left;
  color: #d6e7f1;
  background: transparent;
  border: 0;
  margin: 4px 0;
}

aside button.active {
  background: #29566f;
}

main {
  padding: 22px;
  min-width: 0;
}

header,
.actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  align-items: center;
}

header {
  justify-content: space-between;
  margin-bottom: 18px;
}

h1 {
  font-size: 25px;
  margin: 0 0 6px;
}

h2 {
  font-size: 19px;
}

p {
  line-height: 1.6;
}

.muted {
  color: #64798a;
  font-size: 13px;
}

.notice {
  background: #fff4d9;
  border: 1px solid #ead6a0;
  padding: 12px;
  border-radius: 7px;
  line-height: 1.6;
  margin: 16px 0;
}

.vertical {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card {
  background: white;
  border: 1px solid #d8e3ec;
  padding: 20px;
  border-radius: 9px;
  min-width: 0;
}

.metric {
  border-left: 5px solid var(--green);
}

.metric strong {
  display: block;
  color: var(--green);
  font-size: 29px;
  margin-top: 10px;
}

.scroll {
  overflow: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  white-space: nowrap;
  font-size: 13px;
}

th,
td {
  padding: 11px;
  border: 1px solid var(--border);
  text-align: left;
}

th {
  background: var(--blue);
  color: white;
}

tr:nth-child(even) {
  background: #edf3f9;
}

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 16px 0;
}

.toolbar > * {
  flex: 1;
  min-width: 140px;
}

.auth {
  max-width: 530px;
  margin: 5vh auto;
  padding: 28px;
  background: white;
  border-radius: 12px;
}

.auth input {
  margin: 5px 0 16px;
}

dialog {
  width: min(850px, 96vw);
  max-height: 90vh;
  overflow: auto;
  padding: 24px;
  border: 0;
  border-radius: 12px;
}

dialog::backdrop {
  background: #102c4099;
}

.fields {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

.footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

.error {
  color: #af2037;
}

.success {
  color: var(--green);
}

#status {
  padding: 0 22px 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

#print {
  display: none;
}

@media (max-width: 760px) {
  .shell {
    display: block;
  }

  aside {
    padding: 12px;
  }

  aside h2 {
    display: none;
  }

  aside nav {
    display: flex;
    flex-direction: column;
  }

  main {
    padding: 14px;
  }
}

@media print {
  body > * {
    display: none !important;
  }

  #print {
    display: block !important;
    background: white;
    color: black;
  }

  #print .scroll {
    overflow: visible !important;
  }

  #print table {
    width: 100%;
    table-layout: fixed;
    white-space: normal;
    font-size: 8px;
  }

  #print td,
  #print th {
    padding: 5px 3px;
    white-space: normal;
    overflow-wrap: anywhere;
    vertical-align: top;
  }

  #print th {
    color: black;
    background: #eee;
  }

  #print thead {
    display: table-header-group;
  }

  #print tr {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  #print .vertical {
    display: block;
  }

  #print .card {
    border: 0;
    border-radius: 0;
    padding: 6px;
    margin: 8px 0;
  }

  #print .metric strong {
    font-size: 18px;
  }

  #print h1 {
    font-size: 20px;
  }

  #print h2 {
    font-size: 16px;
  }

  @page {
    size: A4 landscape;
    margin: 8mm;
  }
}
</style>
</head>

<script>
"use strict";

/* =====================================================
   CONFIGURATION SUPABASE
   Clé publique uniquement : aucune clé secrète ici.

const SUPABASE_URL =
  "https://qcrcuncmgfxojdhcdtno.supabase.co";

const SUPABASE_PUBLIC_KEY =

/* =====================================================

   ===================================================== */

const $ = id => document.getElementById(id);

const escapeHTML = value => String(value ?? "").replace(
  /[&<>"']/g,
  character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character])
);

const number = value =>
  Number(value).toLocaleString("fr-FR", {
    maximumFractionDigits: 3
  });

const today = () => {

  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")

};

let client = null;
let user = null;
let profile = null;
let page = "dashboard";
let db = {};
let loadedAt = null;
let sessionEpoch = 0;
let refreshBusy = false;

let filters = {
  q: "",
  depot: "",
  from: "",
  to: ""
};

const admin = () => profile?.role === "admin";

const titles = {

  products: "Produits",

const referenceTypes = [

const schemas = {

function showStatus(message, error = false) {
  $("status").textContent = message;
  $("status").className = error ? "error" : "success";
}

/* =====================================================
   CONNEXION SUPABASE
   ===================================================== */

function showLogin() {
  page = "dashboard";

  $("app").innerHTML = `
    <section class="auth">
      <h1>StockPro</h1>
      <p>Connexion Supabase · Données partagées</p>

      <div class="notice">
        Utilisez l’adresse e-mail et le mot de passe créés
        dans Supabase Auth, pas l’ancien compte local.
        Les anciennes données locales ne sont pas encore importées.
      </div>

      <form id="loginForm">
        <label for="loginEmail">Adresse e-mail</label>
        <input
          id="loginEmail"
          name="email"
          type="email"
          autocomplete="username"
          required
        >

        <label for="loginPassword">Mot de passe</label>
        <input
          id="loginPassword"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button class="primary" type="submit">
          Se connecter
        </button>

        <p id="loginError" class="error"></p>
      </form>
    </section>
  `;

  $("loginForm").onsubmit = async event => {
    event.preventDefault();

    const button = event.target.querySelector("button");
    button.disabled = true;
    $("loginError").textContent = "";

    try {
      const values = Object.fromEntries(new FormData(event.target));

      const { error } = await client.auth.signInWithPassword({
        email: values.email.trim(),
        password: values.password
      });

      if (error) throw error;

      await openSession();
    } catch (error) {
      if ($("loginError")) {
        $("loginError").textContent = error.message;
      } else {
        showStatus(error.message, true);
      }
    } finally {
      button.disabled = false;
    }
  };
}

async function readAll(tableName) {
  const rows = [];
  const pageSize = 500;

  for (let start = 0; ; start += pageSize) {
    const { data, error } = await client
      .from(tableName)
      .select("*")
      .order("id")
      .range(start, start + pageSize - 1);

    if (error) {
      throw new Error(tableName + " : " + error.message);
    }

    rows.push(...data);

    if (data.length < pageSize) break;
  }

  return rows;
}

async function fetchData() {
  const result = {};

  const tables = [
    ...referenceTypes,
    "entries",
    "invoice_lines",
    "outputs",
    "transfers",
    "adjustments"
  ];

  if (admin()) tables.push("audit_log");

  for (const tableName of tables) {
    result[tableName] = await readAll(tableName);
  }

  result.audit_log = result.audit_log || [];

  return result;
}

async function openSession() {
  const epoch = ++sessionEpoch;

  const {
    data: { session },
    error
  } = await client.auth.getSession();

  if (error) throw error;

  if (!session) {
    user = null;
    profile = null;
    db = {};
    showLogin();
    return;
  }

  const { data: account, error: profileError } = await client
    .from("profiles")
    .select("id, name, role")
    .eq("id", session.user.id)
    .maybeSingle();

  if (profileError) throw profileError;

  if (!account) {
    throw new Error(
      "Compte connecté sans profil autorisé. " +
      "Vérifiez son UUID dans la table profiles."
    );
  }

  if (epoch !== sessionEpoch) return;

  user = session.user;
  profile = account;

  const nextData = await fetchData();

  if (epoch !== sessionEpoch) return;

  db = nextData;
  loadedAt = new Date();

  render();
  showStatus("Connexion réussie. Données chargées depuis Supabase.");
}

async function refresh() {
  if (refreshBusy || !profile) return;

  refreshBusy = true;
  showStatus("Actualisation…");

  const epoch = sessionEpoch;

  try {
    const nextData = await fetchData();

    if (epoch !== sessionEpoch) return;

    db = nextData;
    loadedAt = new Date();

    render();
    showStatus("Données actualisées.");
  } catch (error) {
    showStatus("Actualisation impossible : " + error.message, true);
  } finally {
    refreshBusy = false;
  }
}

async function logout() {
  try {
    const { error } = await client.auth.signOut();

    if (error) throw error;

    sessionEpoch++;
    user = null;
    profile = null;
    db = {};

    $("modal").close();

    showLogin();
    showStatus("Déconnecté.");
  } catch (error) {
    showStatus(error.message, true);
  }
}

/* =====================================================
   CALCULS D’AFFICHAGE
   Les écritures sont validées côté Supabase.
   ===================================================== */

function itemName(type, id) {
  return db[type]?.find(item => item.id === id)?.name || "—";
}

function enrichedOutputs() {
  return db.outputs.map(output => {
    const line = db.invoice_lines.find(
      invoice => invoice.id === output.invoice_line_id
    );

    return {
      ...output,
      invoice: line?.invoice || "—",
      invoice_qty: Number(line?.invoice_qty || 0),
      product_id: line?.product_id,
      client_id: line?.client_id
    };
  });
}

function delivered(invoiceLineId) {
  return db.outputs
    .filter(output => output.invoice_line_id === invoiceLineId)
    .reduce((total, output) => total + Number(output.qty), 0);
}

function stock(productId, depotId) {
  const sum = (tableName, condition, field = "qty") =>
    db[tableName]
      .filter(condition)
      .reduce((total, row) => total + Number(row[field]), 0);

  const outputs = enrichedOutputs()
    .filter(row =>
      row.product_id === productId &&
      row.depot_id === depotId
    )
    .reduce((total, row) => total + Number(row.qty), 0);

  return (
    sum("entries", row =>
      row.product_id === productId &&
      row.depot_id === depotId
    )
    - outputs
    + sum("transfers", row =>
      row.product_id === productId &&
      row.dest_id === depotId
    )
    - sum("transfers", row =>
      row.product_id === productId &&
      row.source_id === depotId
    )
    + sum(
      "adjustments",
      row =>
        row.product_id === productId &&
        row.depot_id === depotId,
      "delta"
    )
  );
}

function units(rows) {
  const totals = {};

  rows.forEach(row => {
    const unit = db.products.find(
      product => product.id === row.product_id
    )?.unit || "?";

    totals[unit] = (totals[unit] || 0) + Number(row.qty);
  });

  return Object.entries(totals)
    .map(([unit, quantity]) =>
      number(quantity) + " " + escapeHTML(unit)
    )
    .join("<br>") || "0";
}

function inventoryRows() {
  return db.products.flatMap(product =>
    db.depots.map(depot => ({
      product_id: product.id,
      depot_id: depot.id,
      qty: stock(product.id, depot.id),
      unit: product.unit,
      min: Number(product.min)
    }))
  ).filter(matches);
}

/* =====================================================
   TABLEAUX ET FILTRES
   ===================================================== */

function table(headers, rows) {
  return `
    <div class="scroll">
      <table>
        <thead>
          <tr>
            ${headers.map(header =>
              "<th>" + escapeHTML(header) + "</th>"
            ).join("")}
          </tr>
        </thead>

        <tbody>
          ${rows.length
            ? rows.map(row => `
                <tr>
                  ${row.map(cell => "<td>" + cell + "</td>").join("")}
                </tr>
              `).join("")
            : `
              <tr>
                <td colspan="${headers.length}">Aucune donnée.</td>
              </tr>
            `
          }
        </tbody>
      </table>
    </div>
  `;
}

function panel(title, content) {
  return `
    <section class="card">
      <h2>${title}</h2>
      ${content}
    </section>
  `;
}

function matches(row) {
  const text = [
    JSON.stringify(row),
    itemName("products", row.product_id),
    itemName("clients", row.client_id),
    itemName("suppliers", row.supplier_id),
    itemName("depots", row.depot_id)
  ].join(" ").toLowerCase();

  return (
    (!filters.q || text.includes(filters.q.toLowerCase())) &&
    (
      !filters.depot ||
      [row.depot_id, row.source_id, row.dest_id]
        .includes(filters.depot)
    ) &&
    (!row.date || !filters.from || row.date >= filters.from) &&
    (!row.date || !filters.to || row.date <= filters.to)
  );
}

function filterBar() {
  return `
    <div class="toolbar">
      <input
        aria-label="Recherche"
        placeholder="Rechercher…"
        value="${escapeHTML(filters.q)}"
        onchange="setFilter('q', this.value)"
      >

      <select
        aria-label="Dépôt"
        onchange="setFilter('depot', this.value)"
      >
        <option value="">Tous les dépôts</option>

        ${db.depots.map(depot => `
          <option
            value="${depot.id}"
            ${depot.id === filters.depot ? "selected" : ""}
          >${escapeHTML(depot.name)}</option>
        `).join("")}
      </select>

      <input
        type="date"
        aria-label="Du"
        title="Du"
        value="${escapeHTML(filters.from)}"
        onchange="setFilter('from', this.value)"
      >

      <input
        type="date"
        aria-label="Au"
        title="Au"
        value="${escapeHTML(filters.to)}"
        onchange="setFilter('to', this.value)"
      >

      <button onclick="resetFilters()">Effacer les filtres</button>
    </div>
  `;
}

function setFilter(key, value) {
  filters[key] = value;
  render();
}

function resetFilters() {
  filters = { q: "", depot: "", from: "", to: "" };
  render();
}

function go(destination) {
  page = destination;
  resetFilters();
}

/* =====================================================
   INTERFACE PRINCIPALE
   ===================================================== */

function render() {
  if (!profile) return showLogin();

  if (
    ["audit", "settings"].includes(page) &&
    !admin()
  ) {
    page = "dashboard";
  }

  $("app").innerHTML = `
    <div class="shell">
      <aside>
        <h2>StockPro</h2>

        <nav>
          ${Object.entries(titles)
            .filter(([key]) =>
              admin() || !["audit", "settings"].includes(key)
            )
            .map(([key, title]) => `
              <button
                class="${key === page ? "active" : ""}"
                onclick="go('${key}')"
              >${title}</button>
            `).join("")}
        </nav>
      </aside>

      <main>
        <header>
          <div>
            <h1>${titles[page]}</h1>

            <span class="muted">
              ${escapeHTML(profile.name)} ·
              ${admin() ? "Administrateur" : "Utilisateur"} ·
              Supabase

              <br>

              Dernier chargement :
              ${escapeHTML(loadedAt?.toLocaleString("fr-FR") || "—")}
            </span>
          </div>

          <div class="actions">
            <button onclick="refresh()">Actualiser</button>

            ${page !== "settings" ? `
              <button class="primary" onclick="printPage()">
                Exporter le tableau en PDF
              </button>
            ` : ""}

            <button onclick="logout()">Déconnexion</button>
          </div>
        </header>

        <div class="notice">
          Version Supabase de transition :
          les nouvelles données sont partagées.
          Actualisez pour voir les changements d’un autre appareil.
          Les anciennes données locales ne sont pas importées.
          Les modifications et annulations de mouvements restent
          désactivées, en attente de leurs fonctions sécurisées.
        </div>

        <div id="content"></div>
      </main>
    </div>
  `;

  if (page === "dashboard") showDashboard();
  else if (page === "inventory") showInventory();
  else if (page === "audit") showAudit();
  else if (page === "settings") showSettings();
  else showList();
}

/* =====================================================
   TABLEAU DE BORD VERTICAL
   ===================================================== */

function showDashboard() {
  const inventory = inventoryRows();
  const entries = db.entries.filter(matches);
  const outputs = enrichedOutputs().filter(matches);
  const transfers = db.transfers.filter(matches);

  const pending = db.invoice_lines.filter(line =>
    Number(line.invoice_qty) > delivered(line.id)
  );

  const limit = new Date();
  limit.setDate(limit.getDate() + 30);

  const expirations = db.entries.filter(row =>
    row.expiry &&
    row.expiry <= limit.toISOString().slice(0, 10) &&
    matches(row)
  );

  const indicators = [

function fieldValue(type, key, row) {
  const definition = schemas[type].find(field => field[0] === key);

  if (referenceTypes.includes(definition?.[2])) {
    return itemName(definition[2], row[key]);
  }

  return row[key] ?? "";
}

/* =====================================================
   FORMULAIRES ET ÉCRITURES
   ===================================================== */

function selectOptions(type, selected) {
  return (
    '<option value="">Choisir…</option>' +
    db[type].map(item => `
      <option
        value="${item.id}"
        ${item.id === selected ? "selected" : ""}
      >${escapeHTML(item.name)}</option>
    `).join("")
  );
}

function editRecord(type, id) {
  if (id && !admin()) return;

  if (
    (referenceTypes.includes(type) || type === "adjustments") &&
    !admin()
  ) return;

  if (id && !referenceTypes.includes(type)) return;

  const row = db[type]?.find(item => item.id === id) || {};

  let requestId = crypto.randomUUID();
  let lastPayload = null;
  let saving = false;

  $("modal").innerHTML = `
    <h2>
      ${id ? "Modifier" : "Ajouter"} —
      ${titles[type] || "Comptage"}
    </h2>

    <form id="recordForm">
      <div class="fields">
        ${schemas[type].map(
          ([key, label, fieldType = "text", required]) => {
            const value = row[key] ??
              (key === "date"
                ? today()
                : key === "min"
                  ? 0
                  : ""
              );

            return `
              <div>
                <label for="field_${key}">
                  ${escapeHTML(label)}
                  ${required ? " *" : ""}
                </label>

                ${referenceTypes.includes(fieldType) ? `
                  <select
                    id="field_${key}"
                    name="${key}"
                    ${required ? "required" : ""}
                  >
                    ${selectOptions(fieldType, value)}
                  </select>
                ` : `
                  <input
                    id="field_${key}"
                    name="${key}"
                    type="${fieldType}"
                    value="${escapeHTML(value)}"
                    ${fieldType === "number"
                      ? 'min="0" step="0.001"'
                      : ""
                    }
                    ${required ? "required" : ""}
                  >
                `}
              </div>
            `;
          }
        ).join("")}
      </div>

      <p id="formError" class="error"></p>

      <div class="footer">
        <button id="cancelButton" type="button">
          Annuler
        </button>

        <button id="saveButton" class="primary" type="submit">
          Enregistrer
        </button>
      </div>
    </form>
  `;

  $("modal").showModal();

  $("cancelButton").onclick = () => {
    if (!saving) $("modal").close();
  };

  $("modal").oncancel = event => {
    if (saving) event.preventDefault();
  };

  $("recordForm").onsubmit = async event => {
    event.preventDefault();
    if (saving) return;

    const payload = Object.fromEntries(new FormData(event.target));

    for (const [key, , fieldType, required] of schemas[type]) {
      if (typeof payload[key] === "string") {
        payload[key] = payload[key].trim();
      }

      if (required && !String(payload[key] ?? "").trim()) {
        $("formError").textContent =
          "Remplissez les champs obligatoires.";
        return;
      }

      if (fieldType === "number") {
        payload[key] = Number(payload[key]);

        if (!Number.isFinite(payload[key]) || payload[key] < 0) {
          $("formError").textContent = "Quantité invalide.";
          return;
        }
      }
    }

    if (
      ["entries", "outputs", "transfers"].includes(type) &&
      payload.qty <= 0
    ) {
      $("formError").textContent =
        "La quantité doit être supérieure à zéro.";
      return;
    }

    const serializedPayload = JSON.stringify(payload);

    if (
      lastPayload !== null &&
      lastPayload !== serializedPayload
    ) {
      requestId = crypto.randomUUID();
    }

    lastPayload = serializedPayload;

    saving = true;
    $("saveButton").disabled = true;
    $("cancelButton").disabled = true;
    $("formError").textContent = "";

    let committed = false;

    try {
      if (referenceTypes.includes(type)) {
        const response = id
          ? await client
              .from(type)
              .update(payload)
              .eq("id", id)
              .select("id")
              .single()

          : await client
              .from(type)
              .insert({
                id: requestId,
                ...payload
              })
              .select("id")
              .single();

        if (response.error) throw response.error;
      } else {
        const { error } = await client.rpc(
          "stockpro_add_movement",
          {
            p_kind: type,
            p_data: payload,
            p_request_id: requestId
          }
        );

        if (error) throw error;
      }

      committed = true;
      $("modal").close();

      showStatus(
        "Enregistrement confirmé dans Supabase. Actualisation…"
      );

      const epoch = sessionEpoch;
      const nextData = await fetchData();

      if (epoch !== sessionEpoch) return;

      db = nextData;
      loadedAt = new Date();

      render();

      showStatus(
        "Enregistrement effectué et données actualisées."
      );
    } catch (error) {
      if (committed) {
        showStatus(
          "Enregistrement confirmé, mais affichage non actualisé : " +
          error.message +
          ". Ne recréez pas ce mouvement ; cliquez sur Actualiser.",
          true
        );
      } else if ($("formError")) {
        $("formError").textContent =
          error.message +
          " En cas de coupure réseau, réessayez sans fermer " +
          "le formulaire ni modifier les valeurs.";
      } else {
        showStatus(error.message, true);
      }
    } finally {
      saving = false;

      if ($("saveButton")) {
        $("saveButton").disabled = false;
      }

      if ($("cancelButton")) {
        $("cancelButton").disabled = false;
      }
    }
  };
}

async function deleteReference(type, id) {
  if (!admin() || !referenceTypes.includes(type)) return;

  if (!confirm(
    "Supprimer cet élément ? La base bloquera la suppression " +
    "s’il est utilisé par un mouvement."
  )) return;

  try {
    const { data, error } = await client
      .from(type)
      .delete()
      .eq("id", id)
      .select("id");

    if (error) throw error;

    if (!data.length) {
      throw new Error("Élément absent ou accès refusé.");
    }

    showStatus("Suppression confirmée.");
    await refresh();
  } catch (error) {
    showStatus("Suppression refusée : " + error.message, true);
  }
}

function auditDetail(id) {
  const record = db.audit_log.find(row => row.id === id);

  $("modal").innerHTML = `

/* =====================================================
   EXPORT PDF DE TOUT LE TABLEAU AFFICHÉ
   ===================================================== */

function printPage() {
  if (!profile || page === "settings") return;

  const copy = $("content").cloneNode(true);

  copy.querySelectorAll("button,input,select,.toolbar")
    .forEach(element => element.remove());

  copy.querySelectorAll("table").forEach(item => {
    const lastHeader =
      item.querySelector("thead tr")?.lastElementChild;

    if (
      ["Actions", "Détail"].includes(lastHeader?.textContent)
    ) {
      item.querySelectorAll("tr").forEach(row =>
        row.lastElementChild?.remove()
      );
    }
  });

  const active =
    filters.q || filters.depot || filters.from || filters.to;

  $("print").innerHTML = `
    <h1>StockPro</h1>
    <h2>${escapeHTML(titles[page])}</h2>

    <p>
      Édité par ${escapeHTML(profile.name)}
      le ${escapeHTML(new Date().toLocaleString("fr-FR"))}.
    </p>

    <p>
      Données chargées le
      ${escapeHTML(loadedAt?.toLocaleString("fr-FR") || "—")}.
    </p>

    <p>
      ${active
        ? "Tous les résultats correspondant aux filtres actifs."
        : "Toutes les lignes de la rubrique, sans filtre."
      }
    </p>

    ${active ? `
      <p>
        Recherche : ${escapeHTML(filters.q || "—")} ·

        Dépôt : ${escapeHTML(
          filters.depot
            ? itemName("depots", filters.depot)
            : "Tous"
        )} ·

        Du : ${escapeHTML(filters.from || "—")} ·
        Au : ${escapeHTML(filters.to || "—")}
      </p>
    ` : ""}

    ${copy.innerHTML}

    <p style="margin-top:30px">
      Signature / cachet : __________________________
    </p>
  `;

  window.print();
}

        "Vérifiez votre connexion puis rechargez la page."

    client = window.supabase.createClient(
      SUPABASE_URL,

    $("app").innerHTML = `
      <main>
