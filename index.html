<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockPro — Gestion de stock</title>

<style>
:root {
  --nav: #123247;
  --green: #087f68;
  --blue: #2c6397;
  --bg: #f1f5f9;
  --border: #cddae5;
  --text: #20394c;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px system-ui, Arial, sans-serif;
}

button, input, select { font: inherit; }

button {
  padding: 10px 13px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: white;
  color: var(--text);
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: default;
}

input, select {
  width: 100%;
  padding: 10px;
  border: 1px solid #b9cbd8;
  border-radius: 5px;
  background: white;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}

.primary {
  background: var(--green);
  color: white;
  border-color: var(--green);
}

.danger { color: #af2539; }

.shell {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  min-height: 100vh;
}

aside {
  background: var(--nav);
  color: white;
  padding: 22px 12px;
}

aside h2 { padding-left: 10px; }

aside button {
  display: block;
  width: 100%;
  text-align: left;
  color: #d6e7f1;
  background: transparent;
  border: 0;
  margin: 4px 0;
}

aside button.active { background: #29566f; }

main {
  padding: 22px;
  min-width: 0;
}

header, .actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  align-items: center;
}

header {
  justify-content: space-between;
  margin-bottom: 18px;
}

h1 {
  font-size: 25px;
  margin: 0 0 6px;
}

h2 { font-size: 19px; }
p { line-height: 1.6; }

.muted {
  color: #64798a;
  font-size: 13px;
}

.notice {
  background: #fff4d9;
  border: 1px solid #ead6a0;
  padding: 12px;
  border-radius: 7px;
  line-height: 1.6;
  margin: 16px 0;
}

.vertical {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card {
  background: white;
  border: 1px solid #d8e3ec;
  padding: 20px;
  border-radius: 9px;
  min-width: 0;
}

.metric { border-left: 5px solid var(--green); }

.metric strong {
  display: block;
  color: var(--green);
  font-size: 29px;
  margin-top: 10px;
}

.scroll { overflow: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  white-space: nowrap;
  font-size: 13px;
}

th, td {
  padding: 11px;
  border: 1px solid var(--border);
  text-align: left;
}

th {
  background: var(--blue);
  color: white;
}

tr:nth-child(even) { background: #edf3f9; }

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 16px 0;
}

.toolbar > * {
  flex: 1;
  min-width: 140px;
}

.auth {
  max-width: 530px;
  margin: 5vh auto;
  padding: 28px;
  background: white;
  border-radius: 12px;
}

.auth input { margin: 5px 0 16px; }

dialog {
  width: min(850px, 96vw);
  max-height: 90vh;
  overflow: auto;
  padding: 24px;
  border: 0;
  border-radius: 12px;
}

dialog::backdrop { background: #102c4099; }

.fields {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

.footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

.error { color: #af2037; }
#print { display: none; }

@media (max-width: 760px) {
  .shell { display: block; }
  aside { padding: 12px; }
  aside h2 { display: none; }

  aside nav {
    display: flex;
    flex-direction: column;
  }

  main { padding: 14px; }
}

@media print {
  body > * { display: none !important; }

  #print {
    display: block !important;
    background: white;
    color: black;
  }

  #print .scroll { overflow: visible !important; }

  #print table {
    width: 100%;
    table-layout: fixed;
    white-space: normal;
    font-size: 8px;
  }

  #print td, #print th {
    padding: 5px 3px;
    white-space: normal;
    overflow-wrap: anywhere;
    vertical-align: top;
  }

  #print th {
    color: black;
    background: #eee;
  }

  #print thead { display: table-header-group; }

  #print tr {
    break-inside: avoid;
    page-break-inside: a
